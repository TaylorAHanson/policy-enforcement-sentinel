[pytest]
testpaths = tests
asyncio_mode = auto
addopts = --strict-markers --tb=short
markers =
    safety: regression guards on the non-destructive-by-default model. Never skip these.
    integration: requires real external services; run with --mode real.
filterwarnings =
    ignore::DeprecationWarning:sqlalchemy.*
    ignore::sqlalchemy.exc.SAWarning
    ignore::sqlalchemy.exc.LegacyAPIWarning
    ignore::DeprecationWarning:pydantic.*
    # utcnow() is deprecated in 3.12 and used throughout the models. Replacing
    # it is a migration of its own; until then the warning is noise that hides
    # the ones worth reading.
    ignore:datetime.datetime.utcnow:DeprecationWarning
